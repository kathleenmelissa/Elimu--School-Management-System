<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provision VC Account | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --secondary: #0F172A;
            --danger: #DC2626;
            --bg-main: #F8FAFC;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --radius: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-main); color: #1E293B; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 480px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-title { font-size: 1.25rem; font-weight: 700; color: var(--secondary); margin-bottom: 0.5rem; }
        .card-sub { font-size: 0.85rem; color: #64748B; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--secondary); }
        input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; }
        .btn-primary { width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-title">Create Vice Chancellor Account</div>
        <div class="card-sub">Assign full transaction authorization rights to a Vice Chancellor profile.</div>

        <form id="createVcForm">
            <div class="form-group">
                <label for="vcName">Full Name</label>
                <input type="text" id="vcName" placeholder="Prof. Jane Doe" required>
            </div>
            <div class="form-group">
                <label for="vcEmail">Official Email</label>
                <input type="email" id="vcEmail" placeholder="vc@elimu.ac.ke" required>
            </div>
            <div class="form-group">
                <label for="vcPassword">Assign Password</label>
                <input type="password" id="vcPassword" placeholder="••••••••" minlength="6" required>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Provision VC Credentials</button>
        </form>
    </div>

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJKSBVleO-WCMBl1XUpRd1NDedAtKUsmI",
            authDomain: "elimu-database.firebaseapp.com",
            projectId: "elimu-database",
            storageBucket: "elimu-database.firebasestorage.app",
            messagingSenderId: "341586622750",
            appId: "1:341586622750:web:26634351fe5f55bdb5f10f"
        };

        const mainApp = initializeApp(firebaseConfig);

        document.getElementById("createVcForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.textContent = "Creating Account...";

            const fullName = document.getElementById("vcName").value.trim();
            const email = document.getElementById("vcEmail").value.trim();
            const password = document.getElementById("vcPassword").value;

            try {
                // 1. Initialize secondary app, auth, and firestore
                const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
                const secondaryAuth = getAuth(secondaryApp);
                const secondaryDb = getFirestore(secondaryApp);

                // 2. Create the user in Firebase Auth (automatically signs in on secondaryAuth)
                const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
                const uid = cred.user.uid;

                // 3. Write 'vc' role using secondaryDb while authenticated as the new user (satisfies request.auth.uid == userId)
                await setDoc(doc(secondaryDb, "users", uid), {
                    uid: uid,
                    fullName: fullName,
                    email: email,
                    role: "vc",
                    createdAt: serverTimestamp()
                });

                // 4. Sign out of secondary auth so it doesn't linger
                await secondaryAuth.signOut();

                alert(`VC Account successfully created for ${fullName}!\n\nEmail: ${email}`);
                document.getElementById("createVcForm").reset();
            } catch (err) {
                console.error("Error creating VC:", err);
                alert(`Creation failed: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = "Provision VC Credentials";
            }
        });
    </script>
</body>
</html>
